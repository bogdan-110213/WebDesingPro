<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <!-- Fondo del logo (opcional, transparente por defecto) -->
  <!-- <rect width="200" height="60" fill="#667eea" rx="10"/> -->
  
  <!-- Icono de código/diseño web -->
  <g transform="translate(10, 10)">
    <!-- Monitor/laptop -->
    <rect x="0" y="5" width="40" height="25" rx="3" fill="#667eea"/>
    <rect x="2" y="7" width="36" height="21" rx="2" fill="#764ba2"/>
    
    <!-- Base del laptop -->
    <rect x="10" y="32" width="20" height="3" rx="1" fill="#667eea"/>
    
    <!-- Símbolos de código en la pantalla -->
    <text x="20" y="22" font-family="monospace" font-size="8" fill="#fff" text-anchor="middle">&lt;/&gt;</text>
    
    <!-- Elementos decorativos -->
    <circle cx="8" cy="12" r="2" fill="#f39c12"/>
    <circle cx="14" cy="12" r="2" fill="#e74c3c"/>
    <circle cx="32" cy="12" r="2" fill="#27ae60"/>
  </g>
  
  <!-- Texto WebDesign Pro -->
  <text x="60" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">WebDesign</text>
  <text x="60" y="45" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#667eea">Pro</text>
  
  <!-- Línea decorativa -->
  <line x1="60" y1="50" x2="145" y2="50" stroke="#667eea" stroke-width="2"/>
</svg>